[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexmind"
version = "0.1.0"
description = "Evidence-gated cross-venue informed-flow research and execution system for Lighter perpetuals"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=14",
    "sortedcontainers>=2.4",
    "websockets>=12",
    "aiohttp>=3.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Only needed to sign and send real Lighter transactions.
live = ["lighter-sdk==1.1.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
apexmind = "apexmind.cli:main"

[tool.setuptools.packages.find]
include = ["apexmind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: end-to-end methodology validation (minutes)"]
