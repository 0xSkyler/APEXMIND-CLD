name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # lowest supported (pyproject requires-python) and newest tested
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # "live" pulls lighter-sdk so the offline transaction-signing test runs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,live]"

      - name: Test
        # pyproject's addopts exclude the slow synthetic-control experiment (-m slow)
        run: python -m pytest -q
